<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="title">
  <title id="title">ISO/IEC 27001 Certified — Information Security Management</title>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00A9E0"/>
      <stop offset="100%" stop-color="#0F4C81"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#13213A"/>
      <stop offset="100%" stop-color="#0B1426"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#00A9E0"/>
    </linearGradient>
    <path id="arcTop" d="M 30,100 A 70,70 0 0 1 170,100"/>
    <path id="arcBottom" d="M 24,100 A 76,76 0 0 0 176,100"/>
  </defs>

  <!-- Outer ring -->
  <circle cx="100" cy="100" r="96" fill="url(#ring)"/>
  <circle cx="100" cy="100" r="91" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1" stroke-dasharray="2 3"/>
  <circle cx="100" cy="100" r="62" fill="url(#core)"/>
  <circle cx="100" cy="100" r="62" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Ring text -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#FFFFFF" letter-spacing="2">
    <text font-size="13"><textPath href="#arcTop" startOffset="50%" text-anchor="middle">CERTIFIED</textPath></text>
    <text font-size="9.5" letter-spacing="1.4"><textPath href="#arcBottom" startOffset="50%" text-anchor="middle">INFORMATION SECURITY</textPath></text>
  </g>
  <circle cx="27" cy="100" r="2.5" fill="#FFFFFF"/>
  <circle cx="173" cy="100" r="2.5" fill="#FFFFFF"/>

  <!-- Shield -->
  <path d="M100 52 L118 59 V72 C118 83 110 90 100 94 C90 90 82 83 82 72 V59 Z" fill="url(#shield)"/>
  <path d="M92 72 L98 78 L109 66" fill="none" stroke="#0B1426" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Standard -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#FFFFFF">
    <text x="100" y="114" font-size="12" font-weight="700" letter-spacing="2" fill-opacity="0.8">ISO/IEC</text>
    <text x="100" y="137" font-size="23" font-weight="800" letter-spacing="1">27001</text>
  </g>
</svg>
